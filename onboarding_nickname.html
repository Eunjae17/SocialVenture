<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>옷옷 - 닉네임 설정</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
        }

        body {
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            padding: 0 24px;
            min-height: 100vh;
        }

        .header {
            margin-top: 80px;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.4;
            color: #1A1A1A;
            letter-spacing: -0.5px;
        }

        .input-section {
            margin-top: 48px;
        }

        .input-label {
            font-size: 14px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 10px;
        }

        .input-wrapper {
            position: relative;
        }

        .nickname-input {
            width: 100%;
            height: 56px;
            padding: 0 50px 0 16px;
            border: 1.5px solid #E5E5E5;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            color: #1A1A1A;
            outline: none;
            transition: border-color 0.2s;
            background-color: #FFFFFF;
        }

        .nickname-input:focus {
            border-color: #00C950;
        }

        .nickname-input::placeholder {
            color: #BBBBBB;
        }

        .char-count {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: #888888;
            pointer-events: none;
        }

        .input-message {
            margin-top: 8px;
            font-size: 13px;
            min-height: 18px;
            color: #888888;
        }

        .input-message.error {
            color: #FF5757;
        }

        .input-message.success {
            color: #00C950;
        }

        .start-btn {
            width: 100%;
            height: 56px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: auto;
            margin-bottom: 40px;
            transition: background-color 0.2s, opacity 0.2s;
            background-color: #CCCCCC;
            color: #FFFFFF;
        }

        .start-btn.active {
            background-color: #00C950;
        }

        .start-btn.active:active {
            opacity: 0.85;
        }

        .start-btn:disabled {
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        닉네임을 입력해주세요
    </div>

    <div class="input-section">
        <div class="input-label">닉네임</div>
        <div class="input-wrapper">
            <input 
                type="text" 
                class="nickname-input" 
                id="nicknameInput"
                placeholder="닉네임을 입력하세요"
                maxlength="10"
                autocomplete="off"
            >
            <div class="char-count" id="charCount">0/10</div>
        </div>
        <div class="input-message" id="inputMessage">2자 이상 10자 이하로 입력해주세요</div>
    </div>

    <button class="start-btn" id="startBtn" disabled>
        시작하기
    </button>

    <script>
        const input = document.getElementById('nicknameInput');
        const charCount = document.getElementById('charCount');
        const message = document.getElementById('inputMessage');
        const btn = document.getElementById('startBtn');

        input.addEventListener('input', function() {
            const value = input.value.trim();
            const length = value.length;

            charCount.textContent = length + '/10';

            if (length === 0) {
                message.textContent = '2자 이상 10자 이하로 입력해주세요';
                message.className = 'input-message';
                btn.disabled = true;
                btn.classList.remove('active');
            } else if (length < 2) {
                message.textContent = '2자 이상 입력해주세요';
                message.className = 'input-message error';
                btn.disabled = true;
                btn.classList.remove('active');
            } else {
                message.textContent = '사용 가능한 닉네임이에요';
                message.className = 'input-message success';
                btn.disabled = false;
                btn.classList.add('active');
            }
        });

        btn.addEventListener('click', function() {
            if (btn.disabled) return;
            
            const nickname = input.value.trim();
            localStorage.setItem('userNickname', nickname);
            window.location.href = 'home.html';
        });

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !btn.disabled) {
                btn.click();
            }
        });

        window.addEventListener('load', function() {
            input.focus();
        });
    </script>
</body>
</html>
