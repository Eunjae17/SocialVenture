<script>
  Kakao.init('4825517f3d957c77bda439ac0479327d');

  document.getElementById('btn-kakao').addEventListener('click', function() {
    Kakao.Auth.login({
      success: function(authObj) {
        Kakao.API.request({
          url: '/v2/user/me',
          success: function(res) {
            var nickname = res.kakao_account && res.kakao_account.profile && res.kakao_account.profile.nickname;
            if (nickname) {
              localStorage.setItem('userNickname', nickname);
              window.location.href = 'home.html';
            } else {
              window.location.href = 'onboarding_nickname.html';
            }
          },
          fail: function() { window.location.href = 'onboarding_nickname.html'; }
        });
      },
      fail: function(err) { console.log('Kakao login failed:', err); }
    });
  });

  document.getElementById('btn-apple').addEventListener('click', function() {});
  document.getElementById('btn-email').addEventListener('click', function() {});
  document.getElementById('link-signup').addEventListener('click', function() {});
</script>
