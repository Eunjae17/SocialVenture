<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>옷옷 - 마이페이지</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: #F9FAFB;
    color: #0A0A0A;
  }

  .app {
    width: 100%;
    max-width: 393px;
    min-height: 100vh;
    margin: 0 auto;
    background: #F9FAFB;
    position: relative;
    padding-bottom: 80px;
  }

  /* ===== PROFILE SECTION ===== */
  .profile-section {
    background: white;
    padding: 24px 24px 28px;
  }

  .profile-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }

  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #DCFCE7;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .avatar-inner {
    width: 30px;
    height: 30px;
    background: #0A0A0A;
  }

  .profile-info {
    flex: 1;
  }

  .profile-name {
    font-size: 22px;
    font-weight: 700;
    color: #0A0A0A;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .profile-email {
    font-size: 14px;
    color: #6A7282;
    letter-spacing: -0.2px;
  }

  /* Stats */
  .stats-row {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    padding-top: 8px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  .stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #F0FDF4;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .stat-icon svg {
    width: 24px;
    height: 24px;
    stroke: #00A63E;
    fill: none;
    stroke-width: 1.67;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .stat-label {
    font-size: 12px;
    color: #6A7282;
    letter-spacing: -0.2px;
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 15px;
    font-weight: 500;
    color: #0A0A0A;
    letter-spacing: -0.3px;
  }

  /* ===== MENU LIST ===== */
  .menu-section {
    background: white;
    margin-top: 12px;
  }

  .menu-item {
    display: flex;
    align-items: center;
    padding: 18px 24px;
    cursor: pointer;
    border-bottom: 1px solid #F3F4F6;
    transition: background 0.15s;
  }

  .menu-item:last-child {
    border-bottom: none;
  }

  .menu-item:active {
    background: #F9FAFB;
  }

  .menu-icon {
    width: 24px;
    height: 24px;
    margin-right: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .menu-icon svg {
    width: 22px;
    height: 22px;
    stroke: #4A5565;
    fill: none;
    stroke-width: 1.67;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .menu-label {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    color: #0A0A0A;
    letter-spacing: -0.3px;
  }

  .menu-arrow {
    color: #99A1AF;
    font-size: 18px;
    line-height: 1;
  }

  /* ===== LOGOUT ===== */
  .logout-section {
    padding: 28px 24px;
    text-align: center;
  }

  .logout-btn {
    font-size: 14px;
    font-weight: 600;
    color: #6A7282;
    letter-spacing: -0.2px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 8px 16px;
  }

  .logout-btn:active {
    opacity: 0.6;
  }

  /* ===== BOTTOM NAVIGATION ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 393px;
    background: white;
    border-top: 1px solid #E5E7EB;
    display: flex;
    padding: 8px 0 16px;
    z-index: 100;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    cursor: pointer;
    color: #99A1AF;
    transition: color 0.15s;
  }

  .nav-item.active {
    color: #00A63E;
  }

  .nav-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-icon svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.83;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .nav-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: -0.2px;
  }

  .nav-item.active .nav-label {
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="app">

    <!-- PROFILE SECTION -->
    <div class="profile-section">
      <div class="profile-row">
        <div class="avatar">
          <div class="avatar-inner"></div>
        </div>
        <div class="profile-info">
          <div class="profile-name"><span id="userName">지우</span>님</div>
          <div class="profile-email" id="userEmail">jiwoo@ewhain.net</div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-icon">
            <!-- ribbon/award icon -->
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="6"/>
              <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
            </svg>
          </div>
          <div class="stat-label">완료한 챌린지</div>
          <div class="stat-value">12개</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">
            <!-- ribbon/award icon -->
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="6"/>
              <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
            </svg>
          </div>
          <div class="stat-label">획득 포인트</div>
          <div class="stat-value">2,450P</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">
            <!-- shopping bag icon -->
            <svg viewBox="0 0 24 24">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6z"/>
              <path d="M3 6h18"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
          </div>
          <div class="stat-label">구매한 아이템</div>
          <div class="stat-value">5개</div>
        </div>
      </div>
    </div>

    <!-- MENU SECTION -->
    <div class="menu-section">
      <div class="menu-item">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="6"/>
            <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
          </svg>
        </div>
        <div class="menu-label">내 챌린지 내역</div>
        <div class="menu-arrow">›</div>
      </div>

      <div class="menu-item">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <div class="menu-label">구매/판매 내역</div>
        <div class="menu-arrow">›</div>
      </div>

      <div class="menu-item">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </div>
        <div class="menu-label">설정</div>
        <div class="menu-arrow">›</div>
      </div>

      <div class="menu-item">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div class="menu-label">고객센터</div>
        <div class="menu-arrow">›</div>
      </div>
    </div>

    <!-- LOGOUT -->
    <div class="logout-section">
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <div class="nav-item" onclick="goHome()">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24">
            <path d="M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2V9.5z"/>
          </svg>
        </div>
        <div class="nav-label">홈</div>
      </div>
      <div class="nav-item" onclick="goChallenge()">
        <div class="nav-icon">
          <!-- camera icon -->
          <svg viewBox="0 0 24 24">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <div class="nav-label">챌린지</div>
      </div>
      <div class="nav-item" onclick="goMarket()">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <div class="nav-label">마켓</div>
      </div>
      <div class="nav-item active" onclick="goMypage()">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="nav-label">마이페이지</div>
      </div>
    </nav>
  </div>

  <script>
    // Load nickname from localStorage
    try {
      var nickname = localStorage.getItem('userNickname');
      if (nickname) {
        document.getElementById('userName').textContent = nickname;
      }
    } catch (e) {}

    function goHome() {
      window.location.href = 'home.html';
    }
    function goChallenge() {
      window.location.href = 'challenge.html';
    }
    function goMarket() {
      window.location.href = 'market.html';
    }
    function goMypage() {
      window.location.href = 'mypage.html';
    }
    function logout() {
      try {
        localStorage.removeItem('userNickname');
      } catch (e) {}
      window.location.href = 'onboarding_login.html';
    }
  </script>
</body>
</html>
