<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,maximum-scale=1" name="viewport"/>
<title>옷옷 — 홈 &amp; 마켓</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --g:#00C950;--gl:#E8FFF1;--gd:#00A040;--gb:#F0FDF4;
  --g1:#F8FAFC;--g2:#E2E8F0;--g3:#CBD5E1;--g4:#94A3B8;--g5:#64748B;--g7:#334155;--g9:#0F172A;
  --w:#fff;--r:14px;--rs:10px
}
body{font-family:'Noto Sans KR',sans-serif;background:#C8C8C8;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 0 40px}
#app{width:390px;min-height:844px;background:var(--w);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.sc{display:none;flex-direction:column;height:844px;background:var(--w);overflow:hidden}
.sc.on{display:flex}
.sl{overflow-y:auto;overflow-x:hidden;flex:1}
.sl::-webkit-scrollbar{display:none}

/* NAV */
.nav{display:flex;border-top:1px solid var(--g2);padding:8px 0 22px;flex-shrink:0;background:var(--w)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:10px;color:var(--g4);padding:4px 0}
.ni.on{color:var(--g)}
.ni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* TOPBAR */
.tb{display:flex;align-items:center;justify-content:center;padding:14px 20px;position:relative;border-bottom:1px solid #f0f0f0;flex-shrink:0;background:var(--w)}
.tb h2{font-size:16px;font-weight:700;color:var(--g9)}
.bk{position:absolute;left:16px;background:none;border:none;cursor:pointer;font-size:22px;color:var(--g7);width:36px;height:36px;display:flex;align-items:center;justify-content:center}

/* BUTTONS */
.btn{background:var(--g);color:#fff;border:none;border-radius:14px;padding:17px;font-size:16px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;width:100%}
.btn:active{opacity:.85}
.btn.wh{background:var(--w);color:var(--g9);border:1.5px solid var(--g2)}
.bwrap{padding:12px 20px 28px;flex-shrink:0;display:flex;flex-direction:column;gap:10px}

/* HOME */
.h-top{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 20px 16px}
.h-name{font-size:20px;font-weight:800;color:var(--g9)}
.h-sub{font-size:13px;color:var(--g5);margin-top:3px}
.pbadge{background:var(--gl);color:var(--gd);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700}
.stitle{font-size:15px;font-weight:700;color:var(--g9);padding:0 20px;margin-bottom:10px}

/* CTA */
.cta{margin:0 20px 18px;background:var(--g);border-radius:var(--r);padding:16px 20px;cursor:pointer;min-height:90px;display:flex;align-items:center;justify-content:space-between;border:none;width:calc(100% - 40px)}
.cta-t{color:#fff;font-size:15px;font-weight:700;text-align:left}
.cta-i{font-size:40px}

/* 진행중 챌린지 */
.cscroll{display:flex;gap:12px;overflow-x:auto;padding:0 20px 4px;margin-bottom:18px}
.cscroll::-webkit-scrollbar{display:none}
.cc{min-width:148px;background:var(--g1);border-radius:var(--r);border:1px solid var(--g2);overflow:hidden;cursor:pointer;flex-shrink:0}
.cc-img{width:100%;height:90px;object-fit:cover;display:block}
.cc-body{padding:8px 10px 10px}
.cc-name{font-size:12px;font-weight:700;color:var(--g9)}
.cc-days{font-size:11px;color:var(--g5);margin:3px 0 6px}
.pbar{height:4px;background:var(--g2);border-radius:2px;overflow:hidden}
.pfill{height:100%;background:var(--g);border-radius:2px}

/* 기록 */
.hlist{padding:0 20px;display:flex;flex-direction:column;gap:8px;padding-bottom:16px}
.hc{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--g1);border-radius:var(--rs);border:1px solid var(--g2)}
.hi{flex:1}
.hn{font-size:13px;font-weight:700;color:var(--g9)}
.hs{font-size:11px;color:var(--g5);margin-top:2px}
.tag{padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;flex-shrink:0;white-space:nowrap}
.ti{background:#DBEAFE;color:#1D4ED8}
.te{background:#FEF3C7;color:#D97706}
.td{background:var(--gl);color:var(--gd)}

/* 팝업 */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:20px;padding:28px 24px;width:100%;text-align:center}
.modal-title{font-size:16px;font-weight:700;color:var(--g9);margin-bottom:8px}
.modal-sub{font-size:13px;color:var(--g5);line-height:1.5;margin-bottom:20px}
.modal-btns{display:flex;gap:10px}
.modal-btn{flex:1;padding:14px;border-radius:12px;font-size:14px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;border:none}
.modal-btn.s{background:var(--g2);color:var(--g7)}
.modal-btn.p{background:var(--g);color:#fff}

/* 마켓 목록 */
.mkt-search-area{padding:12px 20px 0;flex-shrink:0}
.mkt-search-box{display:flex;align-items:center;gap:8px;background:var(--g1);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--g4);margin-bottom:12px}
.mkt-filter{margin-left:auto;font-size:18px;cursor:pointer}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 20px 10px;flex-shrink:0}
.cats::-webkit-scrollbar{display:none}
.cat{padding:7px 16px;border-radius:20px;border:1.5px solid var(--g2);background:var(--w);font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap;color:var(--g7);font-weight:500}
.cat.on{background:var(--g);color:#fff;border-color:var(--g)}
.pts-banner{margin:0 20px 12px;background:var(--gl);border-radius:12px;padding:11px 16px;display:flex;justify-content:space-between;flex-shrink:0}
.pts-banner span:first-child{font-size:13px;color:var(--gd)}
.pts-banner span:last-child{font-size:13px;font-weight:700;color:var(--gd)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 16px}
.mcard{background:var(--g1);border-radius:var(--r);overflow:hidden;border:1px solid var(--g2);cursor:pointer;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.mcard-img{width:100%;height:160px;object-fit:cover;display:block}
.mcard-info{padding:10px 12px 12px}
.mcard-name{font-size:13px;font-weight:700;color:var(--g9);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard-pts{font-size:14px;font-weight:800;color:var(--g)}
.mcard-seller{font-size:11px;color:var(--g4);margin-top:4px}
.sold-badge{position:relative}
.sold-badge::after{content:'판매완료';position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;border-radius:var(--r) var(--r) 0 0}

/* 상품 상세 */
.det-img{width:100%;height:280px;object-fit:cover;display:block;flex-shrink:0}
.det-body{padding:18px 20px;flex:1;overflow-y:auto}
.det-body::-webkit-scrollbar{display:none}
.seller-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--g2)}
.seller-av{width:34px;height:34px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.seller-name{font-size:14px;font-weight:700;color:var(--g9);margin-left:8px}
.seller-link{font-size:12px;color:var(--g4);cursor:pointer}
.det-name{font-size:20px;font-weight:800;color:var(--g9);margin-bottom:4px}
.det-pts{font-size:22px;font-weight:900;color:var(--g);margin-bottom:20px}
.det-sec{font-size:14px;font-weight:700;color:var(--g9);margin-bottom:10px;margin-top:16px}
.info-grid{border:1px solid var(--g2);border-radius:var(--rs);overflow:hidden;margin-bottom:4px}
.irow{display:flex;padding:11px 14px;border-bottom:1px solid #f0f0f0}
.irow:last-child{border-bottom:none}
.ilabel{font-size:13px;color:var(--g5);width:80px;flex-shrink:0}
.ival{font-size:13px;color:var(--g9);font-weight:500}
.cert-tags{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.ctag{background:var(--gl);color:var(--gd);font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px}
.seller-msg{background:var(--g1);border-radius:var(--rs);padding:14px;font-size:13px;color:var(--g7);line-height:1.6;margin-bottom:16px}
.pts-notice{font-size:12px;color:var(--g4);text-align:center;margin-bottom:8px}

/* TOAST */
.toast{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:11px 20px;border-radius:20px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
</style>
</head>

<div id="app">

</div>
<div class="bwrap">

</div>
<!-- 구매 확인 팝업 -->
<div class="overlay" id="buy-modal">
<div class="modal">
<div style="font-size:28px;margin-bottom:12px">🛍️</div>
<div class="modal-title">구매하시겠어요?</div>
<div class="modal-sub" id="buy-modal-sub"></div>
<div class="modal-btns">
<button class="modal-btn s" onclick="document.getElementById('buy-modal').classList.remove('on')">취소</button>
<button class="modal-btn p" onclick="document.getElementById('buy-modal').classList.remove('on');document.getElementById('buy-done-modal').classList.add('on')">구매하기</button>
</div>
</div>
</div>
<!-- 구매 완료 팝업 -->
<div class="overlay" id="buy-done-modal">
<div class="modal">
<div style="font-size:36px;margin-bottom:12px">🎉</div>
<div class="modal-title">구매 완료</div>
<div class="modal-sub" id="buy-done-sub"></div>
<button class="modal-btn p" onclick="document.getElementById('buy-done-modal').classList.remove('on');window.location.href='market.html'" style="width:100%;margin-top:4px">확인</button>
</div>
</div>

<div class="overlay" id="insuf-modal">

</div>
</div>

</div>
</div>

</div>

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// URL에서 item ID 가져오기
const urlParams = new URLSearchParams(window.location.search);
const itemId = urlParams.get('item');

(function loadDetail() {
  const item = ITEMS[itemId];
  if (!item) {
    window.location.href = 'market.html';
    return;
  }

  document.getElementById('det-main-img').src = item.img;
  document.getElementById('det-main-img').alt = item.name;
  document.getElementById('det-seller').textContent = item.seller;
  document.getElementById('det-name').textContent = item.name;
  document.getElementById('det-pts').textContent = item.pts + 'P';
  document.getElementById('det-price').textContent = item.price;
  document.getElementById('det-when').textContent = item.when;
  document.getElementById('det-pollution').textContent = item.pollution;
  document.getElementById('det-size').textContent = item.size;
  document.getElementById('det-material').textContent = item.material;
  document.getElementById('det-comment').textContent = item.comment;
  document.getElementById('det-buy-btn').textContent = item.pts + 'P로 구매하기';
  document.getElementById('buy-modal-sub').innerHTML = item.name + '<br><span style="font-size:20px;font-weight:800;color:var(--g)">' + item.pts + 'P</span>';
  document.getElementById('buy-done-sub').textContent = item.name + '을(를) 구매했어요!';

  const userPoints = parseInt(localStorage.getItem('userPoints') || String(USER_POINTS));
  const buyBtn = document.getElementById('det-buy-btn');
  buyBtn.onclick = userPoints >= item.pts
    ? () => document.getElementById('buy-modal').classList.add('on')
    : () => document.getElementById('insuf-modal').classList.add('on');

  const certsEl = document.getElementById('det-certs');
  certsEl.innerHTML = item.certs.map(c => `<span class="ctag">${c}</span>`).join('');
})();
</script>
